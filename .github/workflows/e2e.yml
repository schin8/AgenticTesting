name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      # Throwaway secret for the CI-only SQLite database.
      JWT_SECRET: ci-only-not-a-secret
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v7

      # No em-dashes in docs; protected baseline tests unchanged.
      - name: Guards
        run: bash scripts/check-guards.sh

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up database
        run: pnpm --filter @conduit/api db:setup

      - name: Install Playwright Chromium
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts starts both apps through webServer.
      - name: Run baseline tests
        working-directory: e2e
        run: pnpm exec playwright test

      - name: Upload report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
